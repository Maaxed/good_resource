[package]
name = "good_resource"
version = "0.1.0"
edition = "2024"

[features]
ron = ["dep:ron"]
json = ["dep:serde_json"]
notify = ["dep:notify"]

[dependencies]
derive-where = "1.6.0"
serde = "1.0.228"
variadics_please = "1.1.0"

serde_json = { version = "1.0.145", optional = true }
ron = { version = "0.11.0", optional = true }
notify = { version = "8.2.0", optional = true, default-features = false }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }


[[example]]
name = "test"
required-features = [ "ron", "notify" ]
